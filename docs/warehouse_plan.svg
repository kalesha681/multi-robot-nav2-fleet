  <polygon points="350,960 344,972 356,972" fill="#172033"/>
  <text x="360" y="978" class="small">+y</text>
  <line x1="30" y1="525" x2="60" y2="525" stroke="#172033" stroke-width="2"/>
  <polygon points="70,525 58,519 58,531" fill="#172033"/>
  <text x="35" y="515" class="small">+x</text>

  <rect x="115" y="980" width="470" height="45" rx="5" fill="#fff8df" stroke="#c79824"/>
  <text x="350" y="998" text-anchor="middle" class="small">No ramp is currently placed. Candidate terrain must be selected only after a full visual check.</text>
  <text x="350" y="1015" text-anchor="middle" class="small">Green routes shown above are exact measured floor markings and are no-build corridors.</text>
