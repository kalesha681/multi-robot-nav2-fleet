  <text x="445" y="88" class="small">brown dots: clutter/loose-object centres</text>

  <!-- Existing launch-time robot starts. -->
  <circle class="spawn" cx="350" cy="525" r="10"/>
  <text x="363" y="519" class="small">AMR-1 (0, 0)</text>
  <circle class="spawn" cx="550" cy="525" r="10"/>
  <text x="563" y="541" class="small">AMR-2 (4, 0)</text>

  <!-- Axes. -->
