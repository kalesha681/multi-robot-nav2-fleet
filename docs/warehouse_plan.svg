<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1050" width="700" height="1050">
  <style>
    text { font: 15px sans-serif; fill: #172033; }
    .small { font-size: 12px; }
    .rack { fill: #d9b443; stroke: #705d12; stroke-width: 2; }
    .wall { fill: #f4f5f7; stroke: #495364; stroke-width: 4; }
    .clutter { fill: #a6673f; stroke: #603719; stroke-width: 2; }
    .spawn { fill: #2b70c9; stroke: #123e78; stroke-width: 2; }
    .route { fill: #087a3e; opacity: 0.92; }
  </style>
  <rect width="700" height="1050" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-weight="bold">Warehouse plan — world coordinates</text>
  <text x="350" y="47" text-anchor="middle" class="small">North is up; 1 m = 50 px; objects and green routes are mesh/texture-derived.</text>

  <!-- WallB collision extent: x=-6.99..6.99, y=-10.45..10.45. -->
  <rect class="wall" x="0.5" y="2.5" width="699" height="1045"/>

