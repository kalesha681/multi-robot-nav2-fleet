    <circle cx="275" cy="264" r="12"/><circle cx="375" cy="264" r="12"/>
    <circle cx="523" cy="359" r="12"/><circle cx="627" cy="359" r="12"/>
    <circle cx="619" cy="218" r="12"/><circle cx="512" cy="218" r="12"/>
