  <!-- Shelf F collision extent. -->
  <rect class="rack" x="5.5" y="120" width="105" height="902"/>
  <text x="58" y="112" text-anchor="middle" class="small">Shelf F</text>

  <!-- Eastern Shelf D/E collision extents (x=4.28..5.16). -->
