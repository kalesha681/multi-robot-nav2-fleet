# Fleet Configuration & Warehouse Operational Zones
# Source-of-truth configuration for heterogeneous multi-AMR operations.

warehouse:
  frame_id: "world"
  waypoints:
    base_amr1:
      position: [0.0, 0.0, 0.0]
      orientation_yaw: 0.0
      description: "AMR-1 Base Charging Station"

    base_amr2:
      position: [2.0, 0.0, 0.0]
      orientation_yaw: 0.0
      description: "AMR-2 Base Charging Station"

    heavy_storage:
      position: [-2.0, 4.8, 0.0]
      orientation_yaw: 1.5708
      description: "North-West Heavy Storage Open Staging Bay"

    packing_bay_4:
      position: [2.5, 4.5, 0.0]
      orientation_yaw: 1.5708
      description: "Northeast Packing & Order Staging Bay 4"

    ramp_south_approach:
      position: [-3.4, -4.5, 0.0]
      orientation_yaw: 1.5708
      description: "South approach to custom 10-degree ramp"

    ramp_north_approach:
      position: [-3.4, 4.5, 0.0]
      orientation_yaw: 1.5708
      description: "North exit beyond custom 10-degree ramp"

    elevated_platform:
      position: [-3.4, 0.0, 0.529]
      orientation_yaw: 0.0
      description: "Elevated Storage Platform on Custom Ramp"

    aisle_intersection:
      position: [2.0, 0.0, 0.0]
      orientation_yaw: 0.0
      description: "Central narrow intersection for MAPF yielding tests"

robots:
  bcr_bot_amr1:
    role: "mapper_lead"
    type: "heavy_payload"
    chassis_mass: 70.0  # kg
    max_payload: 100.0   # kg
    nominal_vel_x: 0.5   # m/s
    max_acc_x: 1.5       # m/s^2
    max_jerk_x: 2.0      # m/s^3
    priority: 1          # Higher priority (never yields)
    safety_k: 0.8        # d_safe = k * v^2 + d_min
    safety_d_min: 0.35   # m

  bcr_bot_amr2:
    role: "scout_follower"
    type: "light_scout"
    chassis_mass: 45.0  # kg
    max_payload: 30.0    # kg
    nominal_vel_x: 0.6   # m/s
    max_acc_x: 2.5       # m/s^2
    max_jerk_x: 3.5       # m/s^3
    priority: 2          # Lower priority (yields to AMR-1)
    safety_k: 0.6        # d_safe = k * v^2 + d_min
    safety_d_min: 0.25   # m
